---
layout: default
---

<article>
  <header>
    <h1>{{ page.title }}</h1>

    {% if page.date %}
      <p>
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%B %-d, %Y" }}
        </time>
      </p>
    {% endif %}
  </header>

  {{ content }}

  <p><a href="/notes/">← Back to Notes</a></p>
</article>
